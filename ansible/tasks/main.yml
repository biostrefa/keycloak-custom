---
# - name: Ensure the keycloak directory exists
#   file:
#     path: "{{ keycloak_config_path }}"
#     state: directory
#     mode: "0755"
# - name: Ensure the postgres directory exists
#   file:
#     path: "{{ keycloak_db_path }}"
#     state: directory
#     mode: "0755"

- name: Ensure Docker starts automatically at boot
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
    state: started
  become: true

- name: Ensure the keycloak directories exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    # owner: oski
    # group: oski
  loop:
    - "{{ keycloak_config_path }}"
    - "{{ keycloak_db_path }}"

- name: Set variables from Bitwarden
  set_fact:
    keycloak_pg_db_name: "{{ lookup('community.general.bitwarden', 'hatchlon_keycloak', field='POSTGRES_DB')[0] }}"
    keycloak_pg_user: "{{ lookup('community.general.bitwarden', 'hatchlon_keycloak', field='POSTGRES_USER')[0] }}"
    keycloak_pg_password: "{{ lookup('community.general.bitwarden', 'hatchlon_keycloak', field='POSTGRES_PASSWORD')[0] }}"
    keycloak_pg_port: "{{ lookup('community.general.bitwarden', 'hatchlon_keycloak', field='POSTGRES_PORT')[0] }}"
    keycloak_admin_name: "{{ lookup('community.general.bitwarden', 'hatchlon_keycloak', field='KEYCLOAK_ADMIN_NAME')[0] }}"
    keycloak_admin_password: "{{ lookup('community.general.bitwarden', 'hatchlon_keycloak', field='KEYCLOAK_ADMIN_PASSWORD')[0] }}"
    keycloak_api_key: "{{ lookup('community.general.bitwarden', 'hatchlon_keycloak', field='KEYCLOAK_API_KEY')[0] }}"
  no_log: true

- name: Generate .env file from template
  template:
    src: .env.j2
    dest: "{{ keycloak_config_path }}/.env"
    mode: "0600"

- name: copy Docker Compose files
  copy:
    src: files/{{ item }}
    dest: "{{ keycloak_config_path }}/{{ item }}"
  loop:
    - docker-compose.yml

# use files parameter to use multiple docker-compose.yml files
- name: deploy Docker Compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ keycloak_config_path }}"
    files:
      - docker-compose.yml
    pull: always
    recreate: always
    # - docker-compose.prod.yml
  environment:
    KEYCLOAK_API_KEY: "{{ keycloak_api_key }}"
  no_log: true
  register: output

- name: Install Keycloak boot startup service
  ansible.builtin.template:
    src: keycloak26.service.j2
    dest: /etc/systemd/system/keycloak26.service
    owner: root
    group: root
    mode: "0644"
  become: true
  register: keycloak26_boot_service

- name: Enable Keycloak boot startup service
  ansible.builtin.systemd_service:
    name: keycloak26.service
    enabled: true
    daemon_reload: true
    state: "{{ 'restarted' if keycloak26_boot_service.changed else 'started' }}"
  become: true

- name: Remove uploaded docker-compose file after deployment
  ansible.builtin.file:
    path: "{{ keycloak_config_path }}/docker-compose.yml"
    state: absent

- name: Remove uploaded .env file after deployment
  ansible.builtin.file:
    path: "{{ keycloak_config_path }}/.env"
    state: absent

- name: Show results
  ansible.builtin.debug:
    var: output
